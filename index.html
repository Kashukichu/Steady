<script>
/* Twin connection. Easiest: in the app, Settings > Twin connection. Or set twinUrl here. */
window.STEADY_CONFIG={twinUrl:"",appToken:""};
(function(){if(window.claude)return;var CFG=window.STEADY_CONFIG;
function conn(){try{return JSON.parse(localStorage.getItem("steady-twin"))||{}}catch(e){return{}}}
function dev(){var d=localStorage.getItem("steady-device");if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("");localStorage.setItem("steady-device",d)}return d}
async function viaServer(prompt,url,tok){var h={"content-type":"application/json","x-device":dev()};if(tok)h["x-app-token"]=tok;
var r=await fetch(url.replace(/[/]+$/,"")+"/twin",{method:"POST",headers:h,body:JSON.stringify({prompt:prompt})});
if(r.status==429)return"You’ve reached today’s limit for chats with your Twin. Come back tomorrow, and try a drill or a read in the meantime.";
if(!r.ok)throw{code:"error",message:"Twin server error "+r.status};return(await r.json()).text||""}
async function viaKey(prompt,k){var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:500,messages:[{role:"user",content:prompt}]})});
if(!r.ok)throw{code:"error",message:r.status==401?"API key was rejected (401)":r.status==402||r.status==400?"API error "+r.status+" (check your account has credit)":"API error "+r.status};
var d=await r.json();return(d.content||[]).map(function(c){return c.text||""}).join("")}
async function viaGroq(prompt,k,model){var r;try{r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+k},body:JSON.stringify({model:model||"llama-3.3-70b-versatile",max_tokens:400,messages:[{role:"user",content:prompt}]})})}catch(e){throw{code:"error",message:"Couldn’t reach Groq (network, or the browser blocked it)"}}
if(!r.ok)throw{code:"error",message:r.status==401?"Groq key was rejected (401)":r.status==429?"Groq free limit reached, try again in a minute (429)":r.status==404||r.status==400?"Groq doesn’t recognise that model name ("+r.status+"). Clear the model box or check console.groq.com":"Groq error "+r.status};
var d=await r.json();return((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").trim()}
async function sample(prompt,opts){var c=conn(),url=c.url||CFG.twinUrl,tok=c.token||CFG.appToken,t;
if(url)t=await viaServer(prompt,url,tok);else if(c.key&&/^gsk_/.test(c.key))t=await viaGroq(prompt,c.key,c.model);else if(c.key)t=await viaKey(prompt,c.key);else throw{code:"no_conn",message:"Twin not connected"};
if(opts&&opts.onText)opts.onText({text:t});return{text:t}}
window.claude={use:async function(n){return n=="sample"?sample:null}}})();
</script>
<script>
var K="firstlight-v1",S={done:{},steps:{},mood:{},grat:[],refl:[],twin:{name:"Twin",about:"",goal:"",chat:[]},theme:""},tab="home",open=0,tmr=null;
try{var raw=localStorage.getItem(K);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}

var $=function(s){return document.querySelector(s)};
var esc=function(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var td=function(){return new Date().toLocaleDateString("en-CA")};
var WK=[
["Steady the ship","I’m showing up, and that’s enough for today.",["Make your bed and open the curtains within 10 minutes of waking.","Walk 10 minutes outside with your phone in your pocket.","Pick a fixed lights-out time for tonight and write it down."]],
["Move the body","My body is my ally and I treat it well.",["Do 20 push-ups or squats, in as many sets as you need.","Drink a full glass of water, then eat a proper breakfast.","Text a mate: “Fancy a walk this week?”"]],
["Quiet the noise","I can feel this and still act.",["Charge your phone outside the bedroom tonight.","Write every worry on paper, then circle the one you can act on.","Take 5 slow breaths before opening your first message."]],
["Own your time","I decide what gets my attention.",["Write tomorrow’s one must-do tonight.","Do 25 focused minutes on it, phone in another room.","Mute or delete one app that drains you."]],
["Set a direction","I’m allowed to want more from my life.",["Write 3 things you want in 12 months, no filtering.","Pick one and write the smallest 10-minute step. Do it now.","Write what you’d regret not trying."]],
["Deep work","Small focused effort adds up to big change.",["Do two 25-minute focus blocks on your goal.","Finish one task you’ve avoided for over a week.","Clear one thing: your desk, car or inbox."]],
["Speak with weight","My voice matters and I use it calmly.",["Say hello to someone new and ask one question.","Hold eye contact and speak a little slower in your next chat.","Politely say no to one thing you don’t want."]],
["Face the fear","Courage is acting while afraid.",["Do one slightly scary thing for under 5 minutes.","Ask for something you’ve been hesitant to ask for.","Write the fear, the worst case, and how you’d cope."]],
["Rebuild self-respect","I keep promises to myself.",["Make one promise you can keep today. Keep it.","List 5 hard things you’ve already got through.","Fix one small thing you’ve been putting off."]],
["Real connection","I don’t have to carry this alone.",["Call, don’t text, someone you trust.","Tell one person how you’re really doing.","Thank someone for something specific they did."]],
["Purpose and values","I live by my values, one choice at a time.",["Write your top 3 values and one action for each.","Help someone with something, no strings attached.","Describe the man you want to be in 5 sentences."]],
["Lead yourself","I get knocked down and I get back up.",["Write your first step back for when you slip.","Do the thing you least want to do before noon.","Reread your early entries and note what’s changed."]],
["Make it permanent","This is who I am now.",["Design your ideal weekday morning in 5 steps.","Choose your 3 non-negotiable daily habits.","Write a letter to the you of day 1."]]];
var M="Make your bed and open the curtains within 10 minutes of waking.|Walk 10 minutes outside with your phone in your pocket.|Choose a fixed lights-out time for tonight and write it down.|Eat one proper meal sitting down, no screen.|Tidy one small area: your nightstand or the kitchen counter.|Shower and put on clean clothes before 10am, even on a quiet day.|Review the week: write one win and one thing that was harder than it should be.|Do 20 push-ups or squats, in as many sets as you need.|Drink a full glass of water, then eat a proper breakfast.|Text a mate: “Fancy a walk this week?”|Walk 20 minutes at a brisk pace, anywhere.|Stretch for 5 minutes: hips, hamstrings and shoulders.|Do a 10-minute circuit: squats, push-ups, planks.|Review the week: how does your body feel compared with day 1?|Charge your phone outside the bedroom tonight.|Write every worry on paper, then circle the one you can act on.|Take 5 slow breaths before opening your first message.|Turn notifications off for 1 hour and notice how it feels.|Sit still for 5 minutes with no music and no phone.|Skip news and social media until after lunch.|Review the week: which noise drained you most, and what will you cut?|Write tomorrow’s one must-do tonight.|Do 25 focused minutes on it, phone in another room.|Mute or delete one app that drains you.|Plan your day in 3 blocks: morning, afternoon, evening.|Do your hardest task first, before checking messages.|Say no to one thing that doesn’t matter.|Review the week: where did your time actually go?|Write 3 things you want in 12 months, no filtering.|Pick one and write the smallest 10-minute step. Do it now.|Write what you’d regret not trying.|List what you’re good at, then ask a friend to add one.|Find someone who’s where you want to be and note what they do daily.|Write your goal on a card and put it where you’ll see it.|Review the week: is your direction still right? Adjust it.|Do two 25-minute focus blocks on your goal.|Finish one task you’ve avoided for over a week.|Clear one thing: your desk, car or inbox.|Work 45 minutes with no phone in the room.|Break your goal into 5 steps and do step one.|Learn one new thing about your goal for 15 minutes.|Review the week: what did focus produce?|Say hello to someone new and ask one question.|Hold eye contact and speak a little slower in your next chat.|Politely say no to one thing you don’t want.|Give someone a genuine compliment.|Say what you actually think in one conversation instead of just agreeing.|Stand tall for 2 minutes before a conversation: shoulders back, chin level.|Review the week: when did you feel strongest speaking up?|Do one slightly scary thing for under 5 minutes.|Ask for something you’ve been hesitant to ask for.|Write the fear, the worst case, and how you’d cope.|Make the call or send the message you’ve been dodging.|Do something you’re bad at, on purpose, for 10 minutes.|Introduce yourself to someone at a gym, shop or club.|Review the week: what turned out smaller than you feared?|Make one promise you can keep today. Keep it.|List 5 hard things you’ve already got through.|Fix one small thing you’ve been putting off.|Get up the moment your alarm goes, no snooze.|Catch one harsh thought and say it back as you would to a mate.|Dress well today for no reason.|Review the week: how many promises did you keep?|Call, don’t text, someone you trust.|Tell one person how you’re really doing.|Thank someone for something specific they did.|Invite someone for a coffee or a walk.|Ask a friend a real question and listen without fixing.|Reach out to someone you’ve lost touch with.|Review the week: who lifts you up? Make time for them.|Write your top 3 values and one action for each.|Help someone with something, no strings attached.|Describe the man you want to be in 5 sentences.|Spot one clash between your week and your values and fix it.|Spend 30 minutes on something that matters to you.|Write what you want to be known for.|Review the week: which choices felt like you at your best?|Write your first step back for when you slip.|Do the thing you least want to do before noon.|Reread your early entries and note what’s changed.|Set one stretch goal for the next 30 days.|Finish a hard workout or a long walk.|Teach or show someone something you’ve learned.|Review the week: what are your warning signs and best responses?|Design your ideal weekday morning in 5 steps.|Choose your 3 non-negotiable daily habits.|Write a letter to the you of day 1.|Tell someone what you’ve achieved and ask for their support.|Plan your next 90 days: three goals.|Celebrate: do something you enjoy and write what you’re proudest of.".split("|");
var REV="Weekly review: what went well, what was hard, and what is one thing you’ll change next week?";
var DR=[
["Box breathing",["Breathe in for 4.","Hold for 4.","Breathe out for 4.","Hold for 4. Repeat 4 rounds."]],
["5-4-3-2-1 grounding",["Name 5 things you can see.","4 you can touch.","3 you can hear.","2 you can smell.","1 you can taste. Slow breath out."]],
["Thought flip",["Write the harsh thought.","Is it a fact or a feeling?","Write one piece of evidence against it.","Rewrite it as a fairer thought."]],
["Tiny win",["Pick a task under 2 minutes.","Do it right now.","Say: “That’s one.” Momentum starts here."]],
["Future self",["Close your eyes and breathe slowly.","See yourself 90 days from now, steady and strong.","What do you do first in the morning?","Take one thing he’d do and do it today."]],
["Body reset",["Stand up and roll your shoulders back 5 times.","Unclench your jaw and drop your hands.","Take 10 slow breaths, longer out than in.","Shake out your arms and legs for 20 seconds."]],
["Name it to tame it",["Pause and ask what you’re feeling.","Say: “I notice I’m feeling ___.”","Rate it 1–10.","Breathe out slowly and rate it again."]],
["Victory recall",["Recall a time you were proud of yourself.","Replay what you did and how it felt.","Notice where you feel it in your body.","Tell yourself: “I’ve done hard things before.”"]]];
var GP=["What went right today, however small?","Who made your life easier recently?","Which part of your body served you today?","What’s something ordinary you’d miss if it was gone?","What’s a challenge that taught you something?","What’s one thing about today you’d happily repeat?","What did you enjoy tasting, hearing or seeing?","Who’s glad you’re around?"];
var RP=["What drained me today, and what fed me?","What did I avoid, and what would one small step look like?","Where did I show courage, even a little?","What would I tell a mate in my position?","What am I proud of this week?","What story am I telling myself that may not be true?","What does my best self do next?","What do I need more of tomorrow?"];
var MOODS=["😞","😕","😐","🙂","😄"];
function dayNo(){return Object.keys(S.done).length+1}
function doneToday(){return Object.values(S.done).indexOf(td())>-1}
function streak(){var ds={};Object.values(S.done).forEach(function(x){ds[x]=1});var n=0,d=new Date();if(!ds[d.toLocaleDateString("en-CA")])d.setDate(d.getDate()-1);while(ds[d.toLocaleDateString("en-CA")]){n++;d.setDate(d.getDate()-1)}return n}
function plan(d){var w=d<=90?WK[Math.floor((d-1)/7)]:WK[d%13];return{theme:d<=90?w[0]:"Keep the habit",aff:w[1],mission:M[(d-1)%90],drill:DR[d%8],g:GP[d%8],r:(d%7==0)?REV:RP[d%8]}}
function setTheme(){var r=document.documentElement;S.theme?r.setAttribute("data-theme",S.theme):r.removeAttribute("data-theme")}
function crisisCard(){return '<div class="card crisis"><h3>If you’re in a dark place right now</h3><p>You don’t have to handle this alone. If you might hurt yourself or you’re in danger, call your local emergency number now. In the US, call or text 988. Elsewhere, findahelpline.com lists lines by country. Then tell someone you trust today.</p></div>'}
function nav(){var t=[["today","☀️","Today"],["journey","🗺️","Journey"],["twin","🤝","Twin"],["mind","🧠","Mind"],["read","📖","Read"],["me","📈","Me"]];$("#nav").innerHTML=t.map(function(x){return '<button data-a="tab" data-v="'+x[0]+'" class="'+(tab==x[0]?"on":"")+'"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join("")}

function vToday(){
var d=dayNo(),p=plan(d),st=S.steps[d]||[0,0,0,0,0],n=st.filter(Boolean).length;
if(doneToday())return '<div class="card hero"><h2>Done for today</h2><p>You showed up. That’s the whole job. Day '+(d-1)+' is in the bank and your streak is '+streak()+'.</p><p class="mut">Come back tomorrow for day '+d+': <b>'+esc(plan(d).theme)+'</b>. Want more? Try a drill in Mind or chat with your Twin.</p></div>'+vMove();
var T=[["Check in","1 min"],["Say it out loud","2 min"],["Today’s mission","5 min"],["Mind drill: "+p.drill[0],"3 min"],[d%7==0?"Weekly review":"Gratitude and reflect","4 min"]];

b[4]=(d%7==0?'':'<p class="mut">'+esc(p.g)+'</p><textarea id="g" placeholder="Three things, one per line"></textarea>')+'<p class="mut">'+esc(p.r)+'</p><textarea id="r" placeholder="Write freely. Nobody else sees this."></textarea><button class="pri" data-a="save5">Save</button>';
return nudge()+'<div class="card hero"><span class="mut">'+esc(p.theme)+'</span><div class="aff">'+esc(p.aff)+'</div><div class="bar"><i style="width:'+n*20+'%"></i></div><p class="mut" style="margin:6px 0 0">'+n+' of 5 steps · about 15 minutes</p></div>'+
T.map(function(t,i){return '<div class="step '+(open==i?"on ":"")+(st[i]?"done":"")+'"><button class="sh" data-a="open" data-i="'+i+'"><span class="tk">'+(st[i]?"✓":"")+'</span><span style="flex:1"><b>'+esc(t[0])+'</b><br><span class="mut">'+t[1]+'</span></span></button>'+(open==i?'<div class="sb">'+b[i]+'</div>':"")+'</div>'}).join("")+
vMove()+'<button class="pri" style="width:100%;margin-top:6px" data-a="finish" '+(n<5?"disabled":"")+'>Complete day '+d+'</button>'}

var Q="We suffer more often in imagination than in reality.~Seneca|What stands in the way becomes the way.~Marcus Aurelius|Waste no more time arguing what a good man should be. Be one.~Marcus Aurelius|Very little is needed to make a happy life.~Marcus Aurelius|Begin at once to live.~Seneca|No man is free who is not master of himself.~Epictetus|It is not the critic who counts.~Theodore Roosevelt|If there is no struggle, there is no progress.~Frederick Douglass|A journey of a thousand miles begins with a single step.~Lao Tzu|Do the thing, and you shall have the power.~Ralph Waldo Emerson|Difficulties strengthen the mind, as labor does the body.~Seneca|You don’t need to feel ready. You need to start small.|Motivation is a result. Action is the cause.|One steady day beats one heroic week.|Asking for help is a rep, not a failure.|Be the man who keeps his word to himself.|Bad day? Do the next small thing.|Progress is quiet. Keep showing up.|Your mind is a weather system. You are the sky.|Tired is not the same as weak.|Strong isn’t never falling. It’s getting up and telling someone.|Today’s version of you is allowed to be unfinished.|Move first. Feelings catch up.|You’re not behind. You’re starting from here.|Discipline is a kindness to your future self.|Fear shrinks when you walk toward it.".split("|");
var RD=[["You’re not broken, you’re depleted","When life drains more than it refills, everything feels heavier: decisions, people, mornings. That isn’t weakness. It’s a system running on empty. Rebuilding starts with the unglamorous basics: sleep, food, daylight, movement and a person to talk to. Don’t ask for a new personality. Ask what you can refill today. One walk, one proper meal, one honest conversation. Depletion is fixable, and you’ve already started fixing it by showing up here."],["Motivation follows action","Most of us wait to feel like it. But the feeling usually arrives after we begin, not before. Start with something so small it’s almost silly: put on your shoes, open the document, wash one dish. Ten minutes in, your brain notices the progress and lends you some energy. You don’t need motivation to start. You need a start to create motivation."],["The two-minute rule for bad days","On heavy days, lower the bar until it’s impossible to fail. Two minutes of tidying. Two minutes of stretching. Two minutes of writing one sentence. This isn’t giving up on your goals. It protects the streak of showing up, which matters more than any single big effort. A bad day with two minutes done still counts as a day you didn’t quit."],["Why strong men ask for help","Nobody builds a body alone without a plan, a spotter or a coach. Minds are no different. Telling a friend, a GP or a therapist how you’re really doing isn’t weakness. It’s using the best equipment available. Most people feel relieved and closer, not judged. Start with one sentence: ‘I haven’t been myself lately.’ That’s enough to open the door."],["Comparison is a rigged game","You compare your behind-the-scenes with everyone else’s highlight reel, and you lose every time. The only fair comparison is you against the you of last month. Are you sleeping a bit better? Reacting a bit slower? Reaching out a bit sooner? Track those small gains. They’re real, and they compound quietly while everyone else is busy posting."],["Rest is part of the work","Rest is not the opposite of effort. It’s where the growth happens, in muscles and in minds. If you’re always on, you’ll eventually be always off. Schedule rest like a training session: a proper break, a walk without a podcast, an evening that belongs to nobody. Then come back sharper. Recovery isn’t laziness. It’s strategy."],["Small promises, big self-trust","Every time you say you’ll do something and don’t, you teach yourself that your word is cheap. Every time you do it, even something tiny, you teach yourself you’re reliable. Self-belief isn’t a pep talk. It’s a record. So make smaller promises and keep every one. In a few weeks you’ll notice a quiet confidence that nobody can talk you out of."],["Sit with it, don’t feed it","Anxiety grows when you fight it or feed it with endless what-ifs. Try the opposite: name it (‘this is anxiety’), notice where it sits in your body, and breathe out slowly, longer than you breathe in. The wave rises, peaks and falls, often within minutes. You don’t have to win the argument with your thoughts. You only have to let the wave pass while you do the next small thing."],["Sleep is a superpower","Poor sleep makes everything look worse: problems seem bigger, patience gets shorter and low mood digs in. Before overhauling your life, fix the nights. Same wake time every day, phone out of the bedroom, caffeine before noon, a dark, cool room. Give it two weeks. Many men are surprised how much of ‘who I’ve become’ was simply ‘who I am on five hours of sleep’."],["A setback is data","You slipped. Skipped days, snapped at someone, fell off the plan. The useful question isn’t ‘what’s wrong with me?’ but ‘what happened right before?’ Tired? Hungry? Lonely? Overloaded? Treat the slip as a data point, adjust the plan and restart at the next small step. Nobody builds a new life in a straight line. The ones who succeed simply restart faster."],["Friends are a strength stack","Isolation quietly makes everything harder. The fix doesn’t have to be a big social life. One or two reliable people is plenty. Send the message. Suggest a walk, a game, a coffee. Keep it light at first, then let it get real over time. Being known by someone is one of the most protective things a man can do for his mind."],["The man in the next 90 days","Picture who you’ll be in three months if you keep these small daily habits. Calmer mornings. A clearer head. A few real wins. Not perfect, just steadier. That man isn’t a fantasy. He’s the sum of fifteen minutes a day. Each check-in is a vote for him. Keep voting."]];

function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
async function sid(p){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("steady-id:"+p)))}

RD=RD.concat([["Anger is a messenger","Anger usually guards something softer: hurt, fear, exhaustion or feeling disrespected. It isn’t the enemy, but it’s a poor driver. Move first: walk, lift, push the wall. Then ask what it’s protecting. Say it plainly to the person or to a page. You can keep the energy without the damage, and the message underneath is often the useful part."],["Consistency beats intensity","Nobody transforms in a weekend of fury. The men who change are the ones who do the small thing on a boring Tuesday, then again on Wednesday. Pick a pace you could keep on your worst day and protect it. Fifteen minutes done daily will outrun five hours done once. Be unremarkable every day and remarkable by spring."],["Loneliness isn’t a flaw","Feeling alone doesn’t mean something is wrong with you. It’s a signal, like hunger, that you need connection. Adult life makes it easy to drift, especially for men who were taught to handle everything solo. Reach out first, even when it feels awkward. Join something that meets weekly: a club, a team, a class. Familiar faces build friendships slowly, and slow is fine."],["Your inner critic is a bad coach","Would you talk to a mate the way you talk to yourself after a mistake? A good coach names the error, shows the fix and believes in the player. Your inner critic only does the first part, loudly. Next time, answer it like a coach: ‘Fair point, here’s what I’ll try next.’ Standards stay high. The cruelty goes."],["Circle of control","Draw two circles on paper. In the small one, write what you control: effort, attitude, today’s actions, who you ask for help. Outside, write what you don’t: the economy, other people’s opinions, the past. Spend your energy inside the circle. It feels smaller, but it’s where life actually changes, and worry stops draining you for things you can’t move."],["Walk it out","Some problems don’t get solved at a desk. A twenty-minute walk lowers tension, clears the fog and often hands you the answer you were chasing. Leave the headphones at home once in a while. Notice trees, sky and your own breathing. If a mate comes along, even better: men often talk more easily side by side than face to face."],["Drift and direction","Drift isn’t failure. It’s what happens when nobody has chosen a direction. You don’t need a grand purpose by Friday. Try small experiments: a class, a project, a new routine, a conversation with someone doing work you find interesting. Notice what gives you energy and what drains it. Direction usually shows up as a pattern after a few experiments, not as a lightning bolt."],["Say it plainly","Many men go quiet when things get hard, hoping people will guess. Most won’t. Try short, plain sentences: ‘I’m stressed.’ ‘I need a hand.’ ‘That hurt.’ You don’t need a speech or a perfect moment. Plain words build trust faster than silence, and the first time is the hardest. After that, it becomes a skill you can use anywhere."],["You are more than your job","If work is your whole identity, a bad review or a redundancy can feel like a verdict on you. Widen the picture. You’re also a friend, a son, a neighbour, a learner, someone people rely on. Invest a little in each role every week. When one area wobbles, the others hold you up, and you keep your footing."],["Gratitude without the fluff","Gratitude isn’t pretending everything is fine. It’s training your attention to also notice what’s working, because a stressed brain filters for threats. Write three specific things each day, not ‘my family’ but ‘Sam fixed my bike chain.’ Specifics stick. After a few weeks your attention starts finding the good stuff on its own."],["Money stress and the next step","Money worry is heavy because it feels bottomless. Shrink it. Open the accounts and look at the real numbers; the unknown is usually scarier than the facts. List what’s due, pick the one thing you can fix this week, and do it. If it’s serious, free debt advice services exist in most countries. Facing it is the hardest and most useful step."],["The comeback is boring","People imagine comebacks as dramatic. Real ones are dull: up at the same time, a walk, a proper meal, a task finished, an honest chat, repeat. Boring is good. Boring means stable, and stable is the ground you build everything else on. If your days are starting to feel ordinary, that’s not a lack of progress. That’s the progress."]]);

var ob=btn.closest("details"),ov=ob&&ob.querySelector(".vb");if(ov)ov.remove();speechBad=null;ss.resume();
for(var k=0;k<ps.length&&my==gtok;k++){await speak(ps[k].trim());if(my!=gtok)return;if(speechBad)break}
if(my==gtok){btn.textContent="🔊 Read aloud";delete btn.dataset.on;if(speechBad)vmsg(btn,"Voice was blocked in this view ("+speechBad+"). Open the page in your phone’s browser and check your media volume.")}}

var fin=function(){if(!done){done=true;clearTimeout(wd);r()}};
u.onend=fin;u.onerror=function(e){if(e&&e.error&&e.error!="interrupted"&&e.error!="canceled"){speechBad=e.error;dbgLog("voice",e.error)}fin()};
wd=setTimeout(fin,Math.max(4000,t.length*120));ss.speak(u)})}
